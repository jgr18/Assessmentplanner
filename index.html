<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assessmentplanner</title>
<link rel="stylesheet" href="css/style.css?v=0.8">
</head>
<body>
<div class="vastekop">
<header class="kop">
  <div class="kop-links">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"></rect><rect x="4" y="4" width="5" height="5" fill="#E07A5F"></rect><rect x="10.5" y="10.5" width="5" height="5" fill="currentColor"></rect><rect x="17" y="17" width="5" height="5" fill="currentColor"></rect><rect x="4" y="10.5" width="5" height="5" fill="currentColor"></rect></svg>
    <span class="merk">Assessmentplanner</span><span class="versie" title="Versie van de tool">v0.8</span>
    <label class="verborgen" for="modelnaam">Naam van de planning</label>
    <input id="modelnaam" class="modelnaam" value="">
  </div>
  <div class="kop-rechts">
    <span id="meta" class="meta"></span>
    <span id="status" class="status"></span>
    <div class="bestand" role="group" aria-label="Bestand">
      <button data-actie="nieuw" class="knop-donker">Nieuw</button>
      <button data-actie="openen" class="knop-donker">Excel openen…</button>
      <button data-actie="opslaan" class="knop-donker">Opslaan als Excel</button>
      <button data-actie="sjabloon" class="knop-donker">Sjabloon</button>
      <button data-actie="voorbeeld" class="knop-donker">Voorbeeld</button>
    </div>
    <input id="bestandkiezer" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
  </div>
</header>

<nav class="tabbalk" aria-label="Werkstappen">
  <div class="groep" role="group" aria-label="1 Invoer">
    <span class="groeplabel">1 Invoer</span>
    <div class="tabs"><button data-tab="assessments">Assessments</button><button data-tab="beschikbaarheid">Beschikbaarheid</button><button data-tab="locaties">Locaties</button><button data-tab="tijdvakken">Tijdvakken</button></div>
  </div>
  <span class="scheiding" aria-hidden="true"></span>
  <div class="groep" role="group" aria-label="2 Analyse">
    <span class="groeplabel">2 Analyse</span>
    <div class="tabs"><button data-tab="volgorde">Planningsvolgorde</button><button data-tab="matrix">Afhankelijkheden</button><button data-tab="bezetting">Bezetting</button><button data-tab="lokalen">Lokalen</button></div>
  </div>
  <span class="scheiding" aria-hidden="true"></span>
  <div class="groep" role="group" aria-label="3 Uitvoer">
    <span class="groeplabel">3 Uitvoer</span>
    <div class="tabs"><button data-tab="export">Export &amp; afdrukken</button></div>
  </div>
</nav>
</div>

<div id="meldingen" class="meldingen" aria-live="polite"></div>
<main id="inhoud" class="inhoud"></main>

<script src="js/model.js?v=0.8"></script>
<script src="js/rekenen.js?v=0.8"></script>
<script src="js/xlsx.js?v=0.8"></script>
<script src="js/export.js?v=0.8"></script>
<script src="js/excelio.js?v=0.8"></script>
<script src="js/xlsxlezen.js?v=0.8"></script>
<script src="js/exceliolezen.js?v=0.8"></script>
<script src="js/voorbeeld.js?v=0.8"></script>
<script src="js/app.js?v=0.8"></script>
</body>
</html>
